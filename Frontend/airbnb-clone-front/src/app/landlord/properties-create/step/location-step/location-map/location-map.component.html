<div class="my-3 flex justify-content-center align-items-center">
  <p-autoComplete
    appendTo="body"
    [styleClass]="'autocomplete-airbnb'"
    [panelStyleClass]="'country-panel'"
    [ngModel]="currentLocation"
    (onSelect)="onLocationChange($event)"
    [suggestions]="filteredCountries"
    (completeMethod)="search($event)"
    [dropdown]="true"
    optionLabel="name.common"
    [placeholder]="placeholder()">

    <ng-template let-country #item>
      <div class="flex align-items-center gap-2">
        <img [src]="'https://flagcdn.com/w20/' + country.cca2.toLowerCase() + '.png'"
             width="20" [alt]="country.name.common" />
        <span>{{ country.name.common }}</span>
      </div>
    </ng-template>

    <ng-template let-country #selecteditem>
      <div class="flex align-items-center gap-2">
        <img [src]="'https://flagcdn.com/w20/' + country.cca2.toLowerCase() + '.png'"
             width="20" [alt]="country.name.common" />
        <span>{{ country.name.common }}</span>
      </div>
    </ng-template>
  </p-autoComplete>
</div>

<div leaflet
     [leafletOptions]="options"
     (leafletMapReady)="onMapReady($event)"
     class="map-location z-0">
</div>
